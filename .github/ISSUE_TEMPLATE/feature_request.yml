name: 功能建议
description: 建议新功能或现有流程改进
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 先描述使用场景与困难，不要只写界面或按钮名称。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明用户如何操作，以及怎样才算完成。
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: 主要平台
      options:
        - Windows 和 Android 都需要
        - Windows
        - Android 平板
        - 与平台无关
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已尝试的替代方法
  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      options:
        - label: 我已搜索现有 Issue 和 Pull Request。
          required: true
        - label: 这项建议不要求上传或公开用户的私密学习数据。
          required: true

