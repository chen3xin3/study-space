name: 缺陷报告
description: 报告可重复的错误或异常行为
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        感谢你帮助改进学习空间。请不要上传 API 密钥、数据库、个人学习资料或未打码诊断报告。
  - type: input
    id: version
    attributes:
      label: 应用版本
      placeholder: 例如 0.6.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: 平台
      options:
        - Windows
        - Android 平板
        - 浏览器开发模式
        - 其他
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从启动应用开始，按顺序写出每一步。
      placeholder: |
        1. 打开……
        2. 点击……
        3. 看到……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 其他信息
      description: 可附打码后的截图、日志摘要或设备信息。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索现有 Issue，没有找到同样的问题。
          required: true
        - label: 我已移除密钥、个人数据和其他敏感信息。
          required: true

