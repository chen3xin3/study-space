[package]
name = "my-postgraduate-study-space"
version = "0.6.0"
description = "学习空间 Windows and Android application"
authors = ["Codex"]
edition = "2021"

[lib]
name = "my_postgraduate_space_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
rusqlite_migration = "2.6"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
chacha20poly1305 = "0.10"
sha2 = "0.11"
hex = "0.4"
zip = "6"
thiserror = "2"
walkdir = "2"
tempfile = "3"
keyring = { version = "4.2", features = ["v1"] }
reqwest = { version = "0.13", features = ["blocking", "json"] }
base64 = "0.22"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
